<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="/manifest.json">
  <title>Garage</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }
    #stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    #btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      background: #2ecc71;
      color: #fff;
      box-shadow: 0 0 40px rgba(46,204,113,0.35);
      transition: transform 0.08s ease, background 0.25s ease, box-shadow 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #btn:active  { transform: scale(0.93); }
    /* Declared before the transient state classes so those always win if both land. */
    #btn.unverified { background: #57d894; box-shadow: 0 0 40px rgba(87,216,148,0.30); }
    #btn.sending { background: #e67e22; box-shadow: 0 0 40px rgba(230,126,34,0.45); cursor: default; }
    #btn.done    { background: #2ecc71; box-shadow: 0 0 40px rgba(46,204,113,0.35); cursor: default; }
    #btn.warn    { background: #f1c40f; box-shadow: 0 0 40px rgba(241,196,15,0.40); cursor: default; }
    #btn.error   { background: #e74c3c; box-shadow: 0 0 40px rgba(231,76,60,0.35); }
    #btn.cooldown {
      background: #444;
      color: #999;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      cursor: not-allowed;
    }
    #btn:disabled { cursor: not-allowed; }
    #status { font-size: 0.85rem; color: #666; letter-spacing: 0.04em; text-transform: uppercase; }
    #stats {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.7;
      text-align: center;
    }
    #stats .win { color: #888; }
    /* Power-related reset causes — the ones that point at the supply, not software. */
    #stats .bad { color: #d08a2c; }
    #conn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: #666;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #conn::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
      transition: background 0.2s ease;
    }
    #conn.online::before  { background: #2ecc71; box-shadow: 0 0 6px rgba(46,204,113,0.6); }
    #conn.offline::before { background: #e74c3c; box-shadow: 0 0 6px rgba(231,76,60,0.5); }
    #setup-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 300px;
      text-align: center;
    }
    #setup-wrap strong { font-size: 1.1rem; }
    #setup-wrap p { color: #666; font-size: 0.9rem; line-height: 1.5; }
    #setup-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    #setup-input:focus { border-color: #2ecc71; }
    #setup-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: #2ecc71;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
    }
    #setup-err { color: #e74c3c; font-size: 0.8rem; min-height: 1em; }
    #greeting {
      position: fixed;
      top: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      pointer-events: none;
    }
    #greeting .greeting-text {
      background: linear-gradient(90deg, #ff5e8a, #ff2d6f, #ff8fa3, #ff5e8a);
      background-size: 200% 100%;
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      animation: greeting-gradient 6s ease-in-out infinite;
    }
    #greeting .greeting-heart {
      display: inline-block;
      margin-left: 0.25em;
      animation: greeting-pulse 1.5s ease-in-out infinite;
    }
    @keyframes greeting-gradient {
      0%   { background-position:   0% 50%; }
      50%  { background-position: 200% 50%; }
      100% { background-position:   0% 50%; }
    }
    @keyframes greeting-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.18); }
    }
  </style>
</head>
<body>
  <div id="greeting" hidden></div>
  <div id="stage"></div>
  <div id="conn">Checking…</div>
  <script>
    const params = new URLSearchParams(location.search);
    const urlToken = params.get('t');
    const urlUser  = params.get('u');
    if (urlToken) {
      localStorage.setItem('garage_token', urlToken);
    }
    if (urlUser) {
      localStorage.setItem('garage_user', urlUser.toLowerCase());
    }
    if (urlToken || urlUser) {
      history.replaceState(null, '', location.pathname);
    }

    let token = localStorage.getItem('garage_token');

    renderGreeting();

    function renderGreeting() {
      const el = document.getElementById('greeting');
      if (!el) return;
      const user = (localStorage.getItem('garage_user') || '').toLowerCase();
      if (user === 'tarshley') {
        el.innerHTML = '<span class="greeting-text">Hi Tarshley</span><span class="greeting-heart">❤️</span>';
        el.hidden = false;
      } else {
        el.innerHTML = '';
        el.hidden = true;
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    let connState = 'unknown';   // 'unknown' | 'online' | 'offline'
    let statusFeedStarted = false;

    const COOLDOWN_MS      = 10000;
    const STATS_REFRESH_MS = 60000;
    const DAY_MS           = 86400000;
    let buttonState = null;            // 'idle' | 'idle-offline' | 'sending' | 'result' | 'cooldown'
    let cooldownTimer = null;

    // Declared up here, not next to the stats functions below: initApp() runs
    // mid-file and reaches renderStats(), which would hit the TDZ otherwise.
    let statsData   = null;
    let statsSkewMs = 0;               // server clock minus browser clock — phones drift
    let statsTimer  = null;

    function cooldownRemainingMs() {
      const last = parseInt(localStorage.getItem('garage_last_trigger_ms') || '0', 10);
      if (!last) return 0;
      return Math.max(0, COOLDOWN_MS - (Date.now() - last));
    }

    function applyButtonState() {
      // Sending and result are transient — they manage themselves and call applyButtonState() when done.
      if (buttonState === 'sending' || buttonState === 'result') return;

      const btn    = document.getElementById('btn');
      const status = document.getElementById('status');
      if (!btn || !status) return;  // setup screen is showing — nothing to gate

      if (cooldownTimer) { clearInterval(cooldownTimer); cooldownTimer = null; }
      btn.classList.remove('sending', 'done', 'warn', 'error', 'cooldown', 'unverified');

      const remaining = cooldownRemainingMs();
      if (remaining > 0) {
        buttonState = 'cooldown';
        btn.classList.add('cooldown');
        btn.disabled = true;
        btn.textContent = 'Wait ' + Math.ceil(remaining / 1000) + 's';
        status.textContent = '';
        cooldownTimer = setInterval(() => {
          const rem = cooldownRemainingMs();
          if (rem <= 0) {
            clearInterval(cooldownTimer);
            cooldownTimer = null;
            buttonState = null;
            applyButtonState();
            return;
          }
          btn.textContent = 'Wait ' + Math.ceil(rem / 1000) + 's';
        }, 250);
        return;
      }

      if (connState === 'offline') {
        // A *confirmed* offline is real information, so respect it and block the tap.
        buttonState = 'idle-offline';
        btn.classList.add('cooldown');  // reuse greyed style
        btn.disabled = true;
        btn.textContent = 'Garage offline';
        status.textContent = '';
        return;
      }

      buttonState = 'idle';
      btn.disabled = false;
      btn.textContent = 'Open Garage';
      if (connState === 'online') {
        status.textContent = 'Ready';
      } else {
        // 'unknown' only means the status feed hasn't spoken — that is not evidence
        // the garage is down, so let the tap through and just flag the uncertainty.
        btn.classList.add('unverified');
        status.textContent = 'Ready (unverified)';
      }
    }

    token ? initApp() : showSetupScreen();

    function initApp() {
      startStatusFeed();

      // Always show the manual button — the trigger only fires when the user
      // taps it. (Previously, PWA standalone mode auto-fired on launch and on
      // every visibilitychange, which opened the door just by opening the app.)
      showButtonUI();

      startStats();
    }

    function applyConnUI() {
      const el = document.getElementById('conn');
      if (el) {
        if (connState === 'online')       { el.textContent = 'Garage online';  el.className = 'online';  }
        else if (connState === 'offline') { el.textContent = 'Garage offline'; el.className = 'offline'; }
        else                              { el.textContent = 'Checking…';      el.className = '';        }
      }
      applyButtonState();
    }

    function startStatusFeed() {
      if (statusFeedStarted || !token) return;
      statusFeedStarted = true;

      fetch('/.netlify/functions/wss-creds', {
        headers: { 'Authorization': 'Bearer ' + token },
      })
        .then(r => r.ok ? r.json() : Promise.reject(new Error('creds ' + r.status)))
        .then(creds => loadMqttLib().then(() => openStatusFeed(creds)))
        .catch(() => {});  // status indicator stays "Checking…" — the trigger button still works
    }

    function loadMqttLib() {
      if (window.mqtt) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js';
        s.onload  = resolve;
        s.onerror = () => reject(new Error('mqtt.js failed to load'));
        document.head.appendChild(s);
      });
    }

    function openStatusFeed({ url, username, password, topic }) {
      const client = mqtt.connect(url, {
        username,
        password,
        clean: true,            // we don't need a persistent session for the browser
        reconnectPeriod: 5000,
        keepalive: 60,
      });
      client.on('connect', () => client.subscribe(topic));
      client.on('message', (t, payload) => {
        if (t !== topic) return;
        connState = payload.toString() === 'online' ? 'online' : 'offline';
        applyConnUI();
      });
      client.on('close', () => { connState = 'unknown'; applyConnUI(); });
      client.on('error', () => {});  // mqtt.js will keep retrying
    }

    // --- ESP32 connectivity stats -------------------------------------------
    // /stats returns the raw event log; the 24h / 7d windows are cut here so the
    // windows can change later without re-flashing the ESP32 or redeploying.
    function startStats() {
      // Guests get a working button and nothing else.
      if (statsTimer || !token || token.startsWith('guest-')) return;
      fetchStats();
      statsTimer = setInterval(fetchStats, STATS_REFRESH_MS);
    }

    function fetchStats() {
      fetch('/.netlify/functions/stats', {
        headers: { 'Authorization': 'Bearer ' + token },
      })
        .then(r => r.ok ? r.json() : Promise.reject(new Error('stats ' + r.status)))
        .then(data => {
          statsData = data;
          // Anchor to the server's clock, then keep counting on the browser's, so an
          // ongoing outage still grows between the 60 s refreshes.
          if (typeof data.now === 'number') statsSkewMs = data.now - Date.now();
          renderStats();
        })
        .catch(() => {});  // /stats may not exist yet — render nothing, the button still works
    }

    // Reset causes reported by the device, mapped to something readable. Anything
    // not listed (including events from older firmware, which carry no `rst` at all)
    // is simply not counted. `power` marks the causes that point at the supply
    // rather than at software — the servo shares VBUS with no bulk capacitor, so
    // these are the ones worth noticing.
    const RST_INFO = {
      poweron:   { label: 'power-on' },
      brownout:  { label: 'brownout',    power: true },
      pwrglitch: { label: 'power glitch', power: true },
      budget:    { label: 'connect timeout' }, // firmware restarted itself
      hostreset: { label: 'flash' },           // 1200bps touch from a dev machine
      sw:        { label: 'self-restart' },    // older firmware: could be either
      panic:     { label: 'crash' },
      lockup:    { label: 'lockup' },
      taskwdt:   { label: 'watchdog' },
      intwdt:    { label: 'watchdog' },
      wdt:       { label: 'watchdog' },
      usb:       { label: 'usb reset' },       // USB peripheral reset the chip
      jtag:      { label: 'jtag' },
      sdio:      { label: 'sdio' },
      ext:       { label: 'reset pin' },
      deepsleep: { label: 'deep sleep' },
      efuse:     { label: 'efuse' },
      unknown:   { label: 'unknown' },
    };

    // These strings originate at the MQTT broker, so treat them as hostile even
    // though the poller already whitelists `rst` — this row is built with innerHTML
    // and the page has no CSP, so an unescaped value here would be a stored XSS that
    // hands the permanent door token to whoever published it.
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // One line summarising why the board rebooted inside the window.
    //
    // The total comes from `reboots` (the device's own NVS counter, differenced by
    // the poller), NOT from counting `rst` values — only the most recent reboot in a
    // burst has a knowable cause, because the device republishes one retained
    // session payload rather than one per reset. Any excess is shown as
    // "unattributed" instead of being silently dropped. Events written before
    // `reboots` existed carry only `rst`, which means exactly one.
    //
    // Renders nothing when there are none, including the whole pre-Nano-ESP32
    // history, which has neither field.
    function rebootRow(label, windowMs, events, now) {
      const from = now - windowMs;
      const counts = new Map();
      let total = 0;
      let attributed = 0;

      for (const ev of events) {
        if (ev.t < from || ev.t > now) continue;
        const n = Number.isFinite(ev.reboots) && ev.reboots > 0 ? ev.reboots : (ev.rst ? 1 : 0);
        if (!n) continue;
        total += n;
        if (ev.rst) {
          counts.set(ev.rst, (counts.get(ev.rst) || 0) + 1);
          attributed += 1;
        }
      }
      if (!total) return '';

      const parts = [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .map(([code, n]) => {
          // hasOwnProperty, not `RST_INFO[code] ||` — otherwise rst:"constructor"
          // walks the prototype chain and renders "1 undefined".
          const info = Object.prototype.hasOwnProperty.call(RST_INFO, code) ? RST_INFO[code] : null;
          const text = n + ' ' + esc(info ? info.label : code);
          return info && info.power ? '<span class="bad">' + text + '</span>' : text;
        });
      if (total > attributed) parts.push((total - attributed) + ' unattributed');

      return '<div><span class="win">' + label + '</span> ' + total +
             (total === 1 ? ' reboot · ' : ' reboots · ') + parts.join(' · ') + '</div>';
    }

    // Rebuild outage intervals from the event log. Events are objects of the shape
    // {t, type:'down'|'up', downMs, src, session} plus, on device-observed 'up'
    // events only, {reason, rst}.
    function outageIntervals(events, current, now) {
      const out = [];
      let openAt = null;

      for (const ev of events) {
        if (ev.type === 'down') {
          // A second 'down' with no 'up' between them means the first outage never
          // visibly ended — keep the earlier start instead of inventing an end.
          if (openAt === null) openAt = ev.t;
        } else if (ev.type === 'up') {
          // The device's own downMs is exact; differencing timestamps is only as good
          // as the poller's interval. null / -1 means the device couldn't know.
          const exact = typeof ev.downMs === 'number' && ev.downMs >= 0 ? ev.downMs : null;
          const start = exact !== null ? ev.t - exact : openAt;
          if (start !== null) out.push({ start, end: ev.t });
          openAt = null;
        }
      }

      if (openAt !== null) {
        if (current.state !== 'online') out.push({ start: openAt, end: now });  // still down — count up to now
      } else if (current.state === 'offline' && current.since) {
        out.push({ start: current.since, end: now });  // down, but its 'down' event was pruned
      }
      return out;
    }

    function fmtDur(ms) {
      const s = Math.max(0, Math.round(ms / 1000));
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ' + (s % 60) + 's';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ' + String(m % 60).padStart(2, '0') + 'm';
      return Math.floor(h / 24) + 'd ' + String(h % 24).padStart(2, '0') + 'h';
    }

    function statsRow(label, windowMs, events, outages, now, since) {
      const from  = now - windowMs;
      const drops = events.filter(e => e.type === 'down' && e.t >= from && e.t <= now).length;

      let downMs = 0;
      for (const o of outages) {
        // Clip to the window — an outage straddling the edge only counts inside it.
        const a = Math.max(o.start, from);
        const b = Math.min(o.end, now);
        if (b > a) downMs += b - a;
      }

      // Say so when the log is younger than the window, so "0 drops" over 7d isn't
      // misread as a full week of perfect uptime.
      const covered = since > from ? ' (' + fmtDur(now - since) + ' of data)' : '';
      return '<div><span class="win">' + label + '</span> ' + drops +
             (drops === 1 ? ' drop · ' : ' drops · ') + fmtDur(downMs) + ' down' + covered + '</div>';
    }

    function renderStats() {
      const el = document.getElementById('stats');
      if (!el || !statsData) return;

      const now     = Date.now() + statsSkewMs;
      const events  = (statsData.events || []).slice().sort((a, b) => a.t - b.t);
      const current = statsData.current || {};

      // The backend couldn't read its store at all. Say so rather than rendering
      // this as "no data yet" — that ambiguity once hid a total backend failure
      // (Blobs env not configured) behind an innocuous-looking placeholder.
      if (statsData.ready === false) {
        console.warn('[garage] stats unavailable:', statsData.error || 'unknown');
        el.innerHTML = '<div>Stats unavailable</div>';
        el.hidden = false;
        return;
      }

      // Nothing observed yet (fresh deploy) — the backend still sends since:now,
      // so an empty log alone doesn't mean 100% uptime.
      if (!events.length && current.state !== 'online' && current.state !== 'offline') {
        el.innerHTML = '<div>No connectivity data yet</div>';
        el.hidden = false;
        return;
      }

      const outages = outageIntervals(events, current, now);
      const since   = typeof statsData.since === 'number' ? statsData.since
                    : (events.length ? events[0].t : now);

      el.innerHTML = statsRow('24h', DAY_MS, events, outages, now, since) +
                     statsRow('7d', 7 * DAY_MS, events, outages, now, since) +
                     rebootRow('7d', 7 * DAY_MS, events, now);
      el.hidden = false;
    }

    function showSetupScreen() {
      document.getElementById('stage').innerHTML = `
        <div id="setup-wrap">
          <strong>Device not set up</strong>
          <p>Copy your setup link from the message Mark sent you, then paste it below.</p>
          <input id="setup-input" type="url" placeholder="Paste your setup link…" autocomplete="off" autocorrect="off" spellcheck="false">
          <button id="setup-btn">Save</button>
          <div id="setup-err"></div>
        </div>`;

      const input = document.getElementById('setup-input');
      const errEl = document.getElementById('setup-err');

      function tryToken(val) {
        val = val.trim();
        let tok = null;
        let user = null;
        try {
          const parsed = new URL(val);
          tok  = parsed.searchParams.get('t');
          user = parsed.searchParams.get('u');
        } catch {}
        if (!tok && val.length > 8 && !val.includes(' ')) tok = val;
        if (!tok) { errEl.textContent = 'Invalid link — make sure you copied the whole URL.'; return; }
        localStorage.setItem('garage_token', tok);
        if (user) localStorage.setItem('garage_user', user.toLowerCase());
        token = tok;
        renderGreeting();
        initApp();
      }

      input.addEventListener('input', () => { if (input.value.includes('?t=')) tryToken(input.value); });
      document.getElementById('setup-btn').addEventListener('click', () => tryToken(input.value));
    }

    function showButtonUI() {
      document.getElementById('stage').innerHTML = `
        <button id="btn">Open Garage</button>
        <div id="status">Ready</div>
        <div id="stats" hidden></div>`;

      const btn = document.getElementById('btn');
      btn.addEventListener('click', onButtonClick);
      applyButtonState();
      renderStats();  // the stage was just re-rendered — repaint whatever we already fetched
    }

    async function onButtonClick() {
      if (buttonState !== 'idle') return;

      const btn    = document.getElementById('btn');
      const status = document.getElementById('status');

      buttonState = 'sending';
      btn.classList.remove('done', 'warn', 'error', 'cooldown', 'unverified');
      btn.classList.add('sending');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      status.textContent = '';

      localStorage.setItem('garage_last_trigger_ms', String(Date.now()));

      let resultClass = '', resultText = '', resultStatus = '';
      try {
        const res = await fetch('/.netlify/functions/trigger', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
        });

        if (res.ok) {
          const data = await res.json().catch(() => ({}));
          const msg = (data.message || '').toLowerCase();
          if (data.confirmed && msg.includes('cooldown')) {
            resultClass  = 'warn';
            resultText   = 'Already triggered';
            resultStatus = data.message;
          } else if (data.confirmed) {
            resultClass  = 'done';
            resultText   = 'Opened';
            resultStatus = 'ESP32 confirmed' + (data.message ? ': ' + data.message : '');
          } else {
            resultClass  = 'warn';
            resultText   = 'No reply';
            resultStatus = 'Sent — no garage response';
          }
        } else if (res.status === 401) {
          resultClass  = 'error';
          resultText   = 'Not Authorised';
          resultStatus = 'Token rejected';
        } else {
          throw new Error('HTTP ' + res.status);
        }
      } catch (err) {
        resultClass  = 'error';
        resultText   = 'Error';
        resultStatus = err.message;
      }

      buttonState = 'result';
      btn.classList.remove('sending');
      btn.classList.add(resultClass);
      btn.textContent = resultText;
      status.textContent = resultStatus;

      setTimeout(() => {
        buttonState = null;
        applyButtonState();
      }, 1500);
    }
  </script>
</body>
</html>
