[build]
  publish = "."
  functions = "netlify/functions"

# poll-status is scheduled via the inline `export const config = { schedule }` in
# poll-status.mjs. It is a runtime-API-v2 ES module, so the inline form works and
# no schedule declaration is needed here.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
